nameOverride: fastapi-demo

configMaps:
  app-config:
    labels:
      app: fastapi-demo
    data:
      RATE: "0.5"
      APP_MESSAGE: "Hello from Kubernetes ConfigMap!"
      APP_ENV: "learning"

secrets:
  app-secret:
    labels:
      app: fastapi-demo
    data:
      DSN: "http://f5c2d8386e3849ffbb25fba7d9c08297@127.0.0.1/1"
      SECRET_GREETING: "Hello from Kubernetes Secret!"

pvcs:
  app-data:
    labels:
      app: fastapi-demo
    accessModes:
      - ReadWriteOnce
    storageClassName: local-path
    size: 1Gi

services:
  api:
    labels:
      app: fastapi-demo
    ports:
      - name: http
        port: 8000
        targetPort: http

# ingresses:
#   api.example.com:
#     ingressClassName: nginx
#     hosts:
#       - hostname: api.example.com
#         paths:
#           - path: /
#             pathType: Prefix
#             serviceName: api
#             servicePort: http

deployments:
  api:
    disabled: false
    replicas: 1
    labels:
      app: fastapi-demo

    # nodeSelector:
    #   kubernetes.io/os: linux

    # tolerations:
    #   - key: dedicated
    #     operator: Equal
    #     value: demo
    #     effect: NoSchedule

    # affinity:
    #   podAntiAffinity:
    #     preferredDuringSchedulingIgnoredDuringExecution:
    #       - weight: 100
    #         podAffinityTerm:
    #           topologyKey: kubernetes.io/hostname
    #           labelSelector:
    #             matchLabels:
    #               app: fastapi-demo

    containers:
      - name: api
        image: fastapi-k8s-demo
        imageTag: "1.0.0"
        ports:
          - name: http
            containerPort: 8000

        envConfigmaps:
          - app-config
        envSecrets:
          - app-secret

        volumeMounts:
          - name: app-data
            mountPath: /data

        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 192Mi
    extraVolumes:
    - name: app-data
      persistentVolumeClaim:
        claimName: fastapi-demo-app-data

serviceMonitors:
  fastapi-demo-service-monitor:
    labels:
      app: fastapi-demo
    endpoints:
      - port: http
        path: /metrics
        interval: 15s
        scrapeTimeout: 5s
    extraSelectorLabels:
      app: fastapi-demo
